<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 350px; background: #2b2b2b; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: center; }
        .user-photo { width: 100%; height: 400px; object-fit:😔; }
        .info { padding: 15px; }
        .buttons { display: flex; justify-content: space-around; padding-bottom: 20px; }
        button { border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .dislike { background: #ff4d4d; color: white; }
        .like { background: #4dff88; color: white; }
        button:active { transform: scale(0.8); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/400x400" class="user-photo" alt="Rasm">
        <div class="info">
            <h2>Shaydo, 20</h2>
            <p>📍 Qarshi tumani</p>
        </div>
        <div class="buttons">
            <button class="dislike" onclick="send('Dislike')">❌</button>
            <button class="like" onclick="send('Like')">❤️</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function send(status) {
            tg.sendData(status); // Botga "Like" yoki "Dislike" so'zini yuboradi
            tg.close(); // Ilovani yopadi
        }
    </script>
</body>
</html>
